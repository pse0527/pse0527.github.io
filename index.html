<body>

<!-- ── 인트로 오버레이 ── -->
<div class="intro-overlay" id="intro-overlay">
  <div class="intro-line" id="intro-main"></div>
  <div class="intro-line sub" id="intro-sub">Sangeon &amp; Miji</div>
</div>

<!-- ── BGM 버튼 (화면 고정) ── -->
<button class="bgm-btn" id="bgm-btn" onclick="toggleBgm()" aria-label="배경음악 켜기/끄기">
  <div class="bgm-icon-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="#C9965A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
</div>

<!-- ── 푸터 ── -->
<footer class="footer">
  <div class="footer-names">Sangeon &amp; Miji</div>
  <div class="footer-date">2026 · 10 · 17</div>
</footer>

<script>
  // ── 인트로: 한 글자씩 수기 효과 ──
  document.body.style.overflow = 'hidden';
  const introMain = document.getElementById('intro-main');
  const introSub  = document.getElementById('intro-sub');
  const introOverlay = document.getElementById('intro-overlay');
  const text = '저희 결혼합니다.';
  const charDelay = 120; // 글자당 ms

  text.split('').forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = 'intro-char';
    span.textContent = ch === ' ' ? ' ' : ch;
    span.style.animationDelay = (i * charDelay) + 'ms';
    introMain.appendChild(span);
  });

  // sub 라인: 메인 끝난 후 등장
  const subDelay = text.length * charDelay + 200;
  introSub.style.animationDelay = subDelay + 'ms';

  // 전체 인트로 종료
  const totalDuration = subDelay + 900 + 700;
  setTimeout(() => {
    introOverlay.style.animation = 'introOut 0.7s ease forwards';
    setTimeout(() => {
      introOverlay.remove();
      document.body.style.overflow = '';
    }, 700);
  }, subDelay + 1200);

  // ── PC 차단 (개발 중 주석 처리 / 배포 시 아래 주석 해제) ──
  // function isMobile() {

  //       align-items:center; justify-content:center;
  //       background:#2C2820; color:#F5EDD8; font-family:'Noto Serif KR',serif;
  //       text-align:center; padding:40px;
  //     ">
  //       <div style="font-family:'Cormorant Garamond',serif; font-size:11px; letter-spacing:0.45em; color:#B8975A; margin-bottom:32px; text-transform:uppercase;">Wedding Invitation</div>
  //       <div style="font-family:'Cormorant Garamond',serif; font-size:42px; font-style:italic; font-weight:300; color:#F5EDD8; line-height:1.2; margin-bottom:10px;">Sangeon <span style="color:#B8975A;">&</span> Miji</div>
  //       <div style="width:40px; height:1px; background:#B8975A; margin:28px auto; opacity:0.6;"></div>
  //       <div style="font-weight:300; font-size:15px; color:rgba(245,237,216,0.65); line-height:2.2; word-break:keep-all;">
  //         모바일에서만 열람 가능한 청첩장입니다.<br>
  //         카카오톡 또는 스마트폰 브라우저로 접속해 주세요.
  //       </div>
  //       <div style="margin-top:32px; font-family:'Cormorant Garamond',serif; font-size:12px; letter-spacing:0.25em; color:rgba(184,151,90,0.5);">2026 · 10 · 17</div>
  //     </div>`;
  // }

  // ── 카운트다운 타이머 ──
  function updateCountdown() {
    const weddingDate = new Date('2026-10-17T14:00:00');
    const now = new Date();
    const gap = weddingDate - now;
    if (gap <= 0) {
      ['cd-days','cd-hours','cd-mins','cd-secs'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = '00';
      });
      return;
    }
    const days  = Math.floor(gap / (1000 * 60 * 60 * 24));
    const hours = Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const mins  = Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60));
    const secs  = Math.floor((gap % (1000 * 60)) / 1000);
    const fmt = n => String(n).padStart(2, '0');
    const dEl = document.getElementById('cd-days');
    const hEl = document.getElementById('cd-hours');
    const mEl = document.getElementById('cd-mins');
    const sEl = document.getElementById('cd-secs');
    if (dEl) dEl.textContent = days;
    if (hEl) hEl.textContent = fmt(hours);
    if (mEl) mEl.textContent = fmt(mins);
    if (sEl) sEl.textContent = fmt(secs);
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);

  // ── 계좌번호 복사 ──
  function copyAccount(num, btn) {
    navigator.clipboard.writeText(num).then(() => {
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
    }).catch(() => {
      alert('계좌번호: ' + num);
    });
  }

  // ── 카카오 공유 ──
  // ── 카카오 SDK 초기화 ──
  if (typeof Kakao !== 'undefined' && !Kakao.isInitialized()) {
    Kakao.init('0bd9eb246ec406c5d5d64e0821f6fa3e');
  }

  function shareKakao() {
    if (typeof Kakao === 'undefined' || !Kakao.isInitialized()) {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert('링크가 복사되었습니다!\n카카오톡에 붙여넣기 해주세요 😊');
      });
      return;
    }
    Kakao.Share.sendDefault({
      objectType: 'feed',
      content: {
        title: '박상언 ♥ 권미지 결혼식에 초대합니다',
        description: '2026년 10월 17일 토요일 오후 2시 · 호텔인터불고원주 1층 다이아몬드홀',
        imageUrl: 'https://pse0527.github.io/images/preview.png',
        link: {
          mobileWebUrl: 'https://pse0527.github.io',
          webUrl: 'https://pse0527.github.io'
        }
      },
      buttons: [
        {
          title: '청첩장 보기',
          link: {
            mobileWebUrl: 'https://pse0527.github.io',
            webUrl: 'https://pse0527.github.io'
          }
        }
      ]
    });
  }

  // ── 사진 확대 방지 ──
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());
  document.addEventListener('gestureend', e => e.preventDefault());
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  // ── BGM ──
  const BGM_SRC = 'bgm.mp3';
  let audio = null;
  let bgmPlaying = true; // 디폴트: 켜진 상태
  const bgmBtn = document.getElementById('bgm-btn');

  // 페이지 로드 시 켜진 상태(♬) 로 시작
  bgmBtn.classList.add('playing');

  // BGM 파일 있으면 자동 재생 시도
  if (BGM_SRC) {
    audio = new Audio(BGM_SRC);
    audio.loop = true;
    audio.volume = 0.4;
    audio.play().catch(() => {
      // 자동재생 차단 시 버튼은 켜진 상태 유지, 첫 터치 시 재생
      document.addEventListener('touchstart', function startBgm() {
        audio.play().catch(() => {});
        document.removeEventListener('touchstart', startBgm);
      }, { once: true });
    });
  }

  function toggleBgm() {
    bgmPlaying = !bgmPlaying;
    if (bgmPlaying) {
      bgmBtn.classList.add('playing');
      if (audio) audio.play().catch(() => {});
    } else {
      bgmBtn.classList.remove('playing');
      if (audio) audio.pause();
    }
  }

  // ── 갤러리 (메인+썸네일) ──
  const GALLERY_IMAGES = [
    // 예: 'images/photo01.jpg',
    'images/01.jpg',
    'images/02.jpg',
    'images/03.jpg',
    'images/04.jpg',
    'images/05.jpg',
    'images/06.jpg',
    'images/07.jpg',
    'images/08.jpg',
    'images/10.jpg',
    'images/12.jpg',
    'images/14.jpg',
    'images/16.jpg',
    'images/18.jpg',
    'images/19.jpg',
    'images/20.jpg',
    'images/21.jpg',
    'images/22.jpg',
    'images/23.jpg',
    'images/24.jpg',
    'images/25.jpg',
    'images/27.jpg',
    'images/28.jpg',
    'images/29.jpg',
    'images/30.jpg',
    'images/31.jpg'
  ];

  let gCurrent = 0;
  const mainWrap = document.getElementById('gallery-main-wrap');
  const thumbsWrap = document.getElementById('gallery-thumbs');
  const gEmpty = document.getElementById('gallery-empty');
  const counterCur = document.querySelector('#gallery-counter .cur');
  const counterTotal = document.getElementById('gallery-total');

  function buildGallery() {
    const imgs = GALLERY_IMAGES;
    counterTotal.textContent = imgs.length || 0;
    if (!imgs.length) {
      if (gEmpty) gEmpty.style.display = 'flex';
      return;
    }
    if (gEmpty) gEmpty.remove();

    // 메인 이미지들 생성
    imgs.forEach((src, i) => {
      const img = document.createElement('img');
      img.src = src;
      img.className = 'gallery-main-img' + (i === 0 ? ' active' : '');
      img.alt = '웨딩 사진 ' + (i + 1);
      mainWrap.appendChild(img);
    });

    // 썸네일 DOM 생성 (5개 슬롯 고정)
    for (let slot = 0; slot < 5; slot++) {
      const div = document.createElement('div');
      div.className = 'gallery-thumb';
      const img = document.createElement('img');
      img.alt = '';
      div.appendChild(img);
      div.dataset.slot = slot;
      div.addEventListener('click', () => {
        const idx = parseInt(div.dataset.imgIdx);
        if (!isNaN(idx)) goTo(idx);
      });
      thumbsWrap.appendChild(div);
    }

    renderGallery();
  }

  function renderGallery() {
    if (!GALLERY_IMAGES.length) return;
    const total = GALLERY_IMAGES.length;
    const mainImgs = mainWrap.querySelectorAll('.gallery-main-img');
    const thumbSlots = thumbsWrap.querySelectorAll('.gallery-thumb');

    // 메인 이미지 전환
    mainImgs.forEach((img, i) => img.classList.toggle('active', i === gCurrent));
    counterCur.textContent = gCurrent + 1;

    // 썸네일 5개: 현재 사진이 가운데(슬롯 2)에 오도록
    // 슬롯 오프셋: -2, -1, 0(현재), +1, +2
    thumbSlots.forEach((slot, s) => {
      const offset = s - 2; // -2~+2
      const imgIdx = ((gCurrent + offset) % total + total) % total;
      const img = slot.querySelector('img');
      img.src = GALLERY_IMAGES[imgIdx];
      slot.dataset.imgIdx = imgIdx;
      slot.classList.toggle('active', offset === 0);
    });
  }

  function goTo(i) {
    gCurrent = (i + GALLERY_IMAGES.length) % GALLERY_IMAGES.length;
    renderGallery();
  }

  document.getElementById('gallery-prev').addEventListener('click', () => goTo(gCurrent - 1));
  document.getElementById('gallery-next').addEventListener('click', () => goTo(gCurrent + 1));

  // 스와이프
  let tsX = 0, tsY = 0;
  mainWrap.addEventListener('touchstart', e => { tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; }, { passive: true });
  mainWrap.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tsX;
    const dy = e.changedTouches[0].clientY - tsY;
    if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 1.5) dx < 0 ? goTo(gCurrent + 1) : goTo(gCurrent - 1);
  }, { passive: true });

  buildGallery();

</script>
